<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- css -->
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/fonts.css">
    <link rel="stylesheet" href="css/style.css">
    <!-- js -->
     <script src="js/main.js" defer></script>
  </head>
  <body>
    <header>
      <!-- 01 - Main Visual -->
      <div id="mainVisual">
        <div class="topNotice">
          <p>
            멤버쉽 월 4,900원으로 시작하고, 웰컴 쿠폰과 스포티파이 프리미엄
            베이직까지 받기 >
          </p>
        </div>
        <div class="heroNav">
          <div class="navLeft">
            <a href="https://shopping.naver.com/ns/home" target="_blank">
              <img src="assets/images/back icon.png" alt="back icon" />
            </a>
            <a href="https://shopping.naver.com/ns/home" target="_blank">
              <img
                src="assets/images/naverstore icon.png"
                alt="naverstore icon"
              />
            </a>
          </div>
          <div class="navRight">
            <a href="https://nid.naver.com/membership/join">
              <img src="assets/images/membership.png" alt="membership" />
              <p>지금 시작하기</p>
            </a>
            <button><img src="assets/images/share.png" alt="share" /></button>
          </div>
        </div>
        <div class="heroHeading">
          <img
            src="assets/images/naver _ spotify logo.png"
            alt="naverSpotify"
          />
          <h1>네이버에서 스포티파이를</h1>
          <h3>
            네이버 멤버십으로 내 취향에 맞는 음악 감상까지! <br />
            전 세계 수백만 개의 곡을 네이버에서 스포티파이로 즐기세요
          </h3>
        </div>
        <div class="heroCtaSection">
          <div class="heroCtaGroup">
            <div class="membershipCard">
              <p>아직 멤버십 회원이 아니라면?</p>
              <h3>네이버 멤버십 시작하기</h3>
              <p>
                네이버 멤버십 월 4,900원으로 스포티파이 프리미엄 베이직*이 무료
              </p>
            </div>
            <div class="spotifyCard">
              <p>이미 멤버십 회원이라면?</p>
              <h3>스포티파이 선택하기</h3>
              <p>
                디지털 콘텐츠 혜택 중 스포티파이 프리미엄 베이직*으로 음악듣기
              </p>
            </div>
          </div>
          <p>*약관이 적용됩니다.</p>
        </div>
      </div>
    </header>
    <main>
      <!-- 02 - Introduction -->
      <div id="introduction">
        
      </div>
      <!-- 03 - Playlist -->
      <div id="playList"></div>
      <!-- 04 - Membership -->
      <div id="membership"></div>
      <!-- 05 - Service -->
      <div id="service"></div>
      <!-- 06 - FAQ -->
      <div id="faq"></div>
    </main>
    <footer id="footer">
      <!-- 07 - Footer -->
    </footer>
